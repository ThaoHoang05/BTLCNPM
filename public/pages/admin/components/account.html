<div class="account-manager-container">
    
    <div class="page-header">
        <h2 class="page-title"><i class="fas fa-users-cog"></i> Quản Lý Tài Khoản Hệ Thống</h2>   
    </div>

    <div class="panel-white mt-4">
        <div class="toolbar-flex">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="accountSearch" placeholder="Tìm theo Username, CCCD, Tên..." onkeyup="filterAccounts()">
            </div>
            
            <div class="account-filter-group">
                <select id="roleFilter" class="custom-select" onchange="filterAccounts()">
                    <option value="all">Tất cả vai trò</option>
                    <option value="ToTruong">Tổ trưởng</option>
                    <option value="ToPho">Tổ phó</option>
                    <option value="CanBo">Cán bộ</option>
                    <option value="NguoiDan">Cư dân (Người dân)</option>
                </select>
            
                <select id="statusFilter" class="custom-select" onchange="filterAccounts()">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="active">Hoạt động</option>
                    <option value="locked">Đã khóa</option>
                </select>
            
                <button class="btn-primary" onclick="openAccountModal()">
                    <i class="fas fa-plus-circle"></i> Thêm Tài Khoản
                </button>
            </div>
        </div>

        <div class="table-responsive mt-3">
            <table class="table table-hover table-bordered account-custom-table" id="accountTable">
                <thead>
                    <tr>
                        <th width="50">#</th>
                        <th>Username (CCCD)</th>
                        <th>Họ và tên</th>
                        <th>Vai trò</th>
                        <th>Trạng thái</th>
                        <th width="150" class="text-center">Hành động</th>
                    </tr>
                </thead>
                <tbody id="accountTableBody">
                    </tbody>
            </table>
        </div>
        
        <div class="pagination-container account-custom-pagination">
            <span class="page-info">Hiển thị 1-10 trên 50 kết quả</span>
            <div class="pagination-controls">
                <button class="btn-page" disabled><i class="fas fa-chevron-left"></i></button>
                <button class="btn-page active">1</button>
                <button class="btn-page">2</button>
                <button class="btn-page">3</button>
                <button class="btn-page"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>
</div>

<div id="accountModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">
            <h3 id="modalTitle"><i class="fas fa-user-plus"></i> Thêm Tài Khoản Mới</h3>
            <span class="close-btn" onclick="closeAccountModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form id="accountForm">
                <input type="hidden" id="accId"> <div class="form-group">
                    <label>Tên đăng nhập (CCCD) <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="accUsername" required placeholder="Nhập số CCCD">
                </div>
                
                <div class="form-group">
                    <label>Họ và tên hiển thị <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="accFullname" required placeholder="Nhập họ tên đầy đủ">
                </div>

                <div class="form-group">
                    <label>Mật khẩu <span id="passHint" class="text-muted small">(Mặc định: 123456)</span></label>
                    <input type="password" class="form-control" id="accPassword" placeholder="Để trống nếu giữ nguyên">
                </div>

                <div class="form-row">
                    <div class="col-half">
                        <label>Vai trò</label>
                        <select class="form-control" id="accRole">
                            <option value="1">Tổ trưởng</option>
                            <option value="2">Tổ phó</option>
                            <option value="3">Cán bộ</option>
                            <option value="4">Cư dân (Người dân)</option>
                        </select>
                    </div>
                    <div class="col-half">
                        <label>Trạng thái</label>
                        <select class="form-control" id="accStatus">
                            <option value="active">Hoạt động</option>
                            <option value="locked">Khóa</option>
                        </select>
                    </div>
                </div>

                <div class="modal-actions mt-4">
                    <button type="button" class="btn-secondary" onclick="closeAccountModal()">Hủy</button>
                    <button type="submit" class="btn-primary">Lưu thông tin</button>
                </div>
            </form>
        </div>
    </div>
</div>
