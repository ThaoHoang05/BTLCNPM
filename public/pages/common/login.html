<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Đăng nhập hệ thống</title>
    <link rel="stylesheet" href="../../css/base.css"/>
    <link rel="stylesheet" href="../../css/login.css"/>
    <script src="../../js/common/login.js"></script>
</head>

<body>
    <div class="top-head">
        <h1>TỔ DÂN PHỐ SỐ 7</h1>
        <ul class="nav">
            <li><a href="../index.html">Trang thông tin</a></li>
            <li><a href="contact.html">Liên hệ</a></li>
            <li><a href="form.html">Điền form</a></li>
        </ul>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>ĐĂNG NHẬP</h2>
                <p>Hệ thống quản lý</p>
            </div>
            
            <form id="loginform">
                <div class="input-group">
                    <label for="username">Tài khoản</label>
                    <input type="text" id="username" placeholder="Nhập tên đăng nhập" required/>
                </div>
                
                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu" required/>
                </div>
                
                <input type="submit" value="Đăng nhập" onclick="getUser(event)"/>
            </form>
        </div>
    </div>
</body>
</html>
