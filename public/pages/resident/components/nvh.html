<div class="resident-booking-layout">
    
    <div class="booking-header">
        <div class="header-info">
            <h2><i class="fas fa-landmark"></i> Đăng ký sử dụng Nhà văn hóa</h2>
            <p>Đăng ký tổ chức sự kiện, đám cưới, hoặc các hoạt động tập thể.</p>
        </div>
        <button class="btn-new-booking" onclick="openBookingModal()">
            <i class="fas fa-plus-circle"></i> Tạo đơn đăng ký mới
        </button>
    </div>

    <div class="booking-history">
        <h3>Lịch sử đăng ký của bạn</h3>
        <table class="history-table">
            <thead>
                <tr>
                    <th>Tên sự kiện</th>
                    <th>Địa điểm mong muốn</th>
                    <th>Thời gian</th>
                    <th>Trạng thái</th>
                    <th>Ghi chú / Phản hồi</th>
                </tr>
            </thead>
            <tbody id = "history-table-body">
                <!-- Dữ liệu lịch sử sẽ được chèn vào đây bằng JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<div id="bookingModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-pen-fancy"></i> Phiếu đăng ký mượn phòng</h3>
            <span class="close-btn" onclick="closeBookingModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form id="bookingForm" onsubmit="handleFormSubmit(event)">
                <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label for="event">Sự kiện <span class="required">*</span>:</label>
                        <input type="text" id="event" class="form-control" required placeholder="Ví dụ: Đám cưới, Họp lớp...">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="type">Loại hình thuê:</label>
                        <select id="type" class="form-control">
                            <option value="default" disabled selected>Chọn kiểu thuê</option>
                            <option value="CaNhan">Cá nhân</option>
                            <option value="ToChuc">Tổ chức</option>
                        </select>
                    </div>
                </div>
        
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullname">Họ và tên:</label>
                        <input type="text" id="fullname" class="form-control" required readonly style="background-color: #e9ecef;">
                    </div>
                    <div class="form-group">
                        <label for="cccd">CCCD:</label>
                        <input type="text" id="cccd" class="form-control" required readonly style="background-color: #e9ecef;">
                    </div>
                </div>
        
                <div class="form-row">
                    <div class="form-group">
                        <label for="numberphone">Số điện thoại <span class="required">*</span>:</label>
                        <input type="tel" id="numberphone" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email <span class="required">*</span>:</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                </div>
        
                <div class="form-group">
                    <label for="place">Địa điểm <span class="required">*</span>:</label>
                    <select id="place" class="form-control" required>
                        <option value="default" disabled selected>Chọn địa điểm</option>
                        <option value="1">Hội trường lớn</option>
                        <option value="2">Phòng Sinh Hoạt Cộng Đồng</option>
                        <option value="3">Phòng Đa Năng</option>
                        <option value="5">Phòng Sinh Hoạt Thanh Niên</option>
                        <option value="6">Phòng Nghiên cứu & Tài liệu</option>
                    </select>
                </div>
        
                <div class="form-row">
                    <div class="form-group">
                        <label for="from">Thuê từ <span class="required">*</span>:</label>
                        <input type="datetime-local" id="from" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="to">Đến <span class="required">*</span>:</label>
                        <input type="datetime-local" id="to" class="form-control" required>
                    </div>
                </div>
        
                <div class="form-group full-width">
                    <label for="reason">Lý do:</label>
                    <textarea id="reason" class="form-control" rows="3" placeholder="Nhập lý do..."></textarea>
                </div>
        
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeBookingModal()">Đóng</button>
                    <button type="submit" class="btn-submit">Gửi yêu cầu</button>
                </div>
            </form>
        </div>
    </div>
</div>
